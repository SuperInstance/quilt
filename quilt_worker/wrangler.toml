name = "quilt-demo"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
# No vars needed; secrets will be used for CF_ACCOUNT_ID and CF_AI_TOKEN

[env.production]
# Production environment can have different limits if needed

[triggers]
# No scheduled triggers needed

[kv_namespaces]
# Bind the KV namespace to the env variable USAGE
binding = "USAGE"
# The id will be filled after creation via wrangler kv:namespace create USAGE
