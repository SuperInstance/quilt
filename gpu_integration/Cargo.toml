[package]
name = "quilt_gpu"
version = "0.1.0"
edition = "2021"

[dependencies]
# CUDA Rust bindings
cust = "0.3"
tokio = { version = "1", features = ["full"] }
# For lock-free queue atomics (we'll use std::sync::atomic)
# Optional: crossbeam for more advanced atomics if needed
crossbeam = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"