# Dependabot configuration — TypeScript / Node.js
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "automated"
    # Group patch + minor updates to reduce PR noise
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    # Ignore major bumps for runtime libs we control
    ignore:
      - dependency-name: "@superinstance/*"
        update-types: ["version-update:semver-major"]
      # TypeScript majors are blocked until typescript-eslint supports
      # them (its peers cap TypeScript at <6.1.0; TS 7.0 also ships no
      # JS API). The TS 6->7 bump was merged once, broke CI, and was
      # deliberately reverted — do not re-propose it. Revisit when
      # typescript-eslint supports TS 7 (expected early 2027).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "automated"
    groups:
      github-actions:
        update-types: ["minor", "patch", "major"]
