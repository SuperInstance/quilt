name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs when a new commit lands on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [incredibuild-ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # No `|| npm install` fallback: a broken lockfile must fail loudly,
      # not silently retry as a floating install.
      - name: Install dependencies
        run: npm ci

      # Each package's build is `tsc` — the build IS the type check.
      # (The old standalone tsc step pointed at a nonexistent root
      # config and could never fail, so it has been removed.)
      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

  smoke:
    name: tarball smoke test
    runs-on: incredibuild-ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Pack core and run the README example against the tarball
        run: node scripts/smoke-tarball.mjs

  lint-audit:
    name: lint & audit
    runs-on: incredibuild-ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high || {
            echo "::warning::npm audit found high-severity issues. See https://github.com/SuperInstance/${{ github.event.repository.name }}/security/dependabot"
          }
