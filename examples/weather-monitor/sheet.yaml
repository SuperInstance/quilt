id: weather-monitor
title: "Reactive Weather Station"
description: >
  Real-time weather monitor that ingests three sensor streams
  (temperature, humidity, pressure), derives a "feels like" heat
  index via a formula cell, and fires a listener alert when
  conditions become dangerous. Demonstrates sensor → formula →
  listener reactive composition across multiple cell kinds.
version: 0.2.0

axes:
  rows: { name: metric }
  cols: { name: source }

cells:
  # -------------------------------------------------------------------------
  # Sensors — three independent data sources.
  # In production, `source` would be a real I/O URL (i2c:/dev/i2c-1,
  # http://weather.api, etc.). For this example we use simulated
  # values that you can override via the engine.
  # -------------------------------------------------------------------------

  - id: sensor.temperature
    kind: sensor
    source: simulated
    rate: 1000
    unit: celsius
    default: 22.0
    description: "Ambient air temperature"

  - id: sensor.humidity
    kind: sensor
    source: simulated
    rate: 1000
    unit: percent
    default: 55.0
    description: "Relative humidity (0-100)"

  - id: sensor.pressure
    kind: sensor
    source: simulated
    rate: 1000
    unit: hPa
    default: 1013.25
    description: "Barometric pressure"

  # -------------------------------------------------------------------------
  # Formulas — derived values that recompute whenever their inputs
  # change. Note that formulas reference cells by bare id; the engine
  # rewrites these to cells["..."] under the hood.
  # -------------------------------------------------------------------------

  - id: feels_like_c
    kind: formula
    expr: "=sensor.temperature - ((100 - sensor.humidity) / 5)"
    unit: celsius
    description: "Apparent temperature in still air"

  - id: feels_like_f
    kind: formula
    expr: "=(feels_like_c * 9 / 5) + 32"
    unit: fahrenheit
    description: "Apparent temperature in imperial units"

  - id: dew_point_c
    kind: formula
    expr: "=sensor.temperature - ((100 - sensor.humidity) / 5)"
    unit: celsius
    description: "Dew point — the temperature at which condensation forms"

  - id: is_comfortable
    kind: formula
    expr: "=sensor.temperature >= 18 && sensor.temperature <= 26 && sensor.humidity >= 30 && sensor.humidity <= 60"
    description: "Boolean: is the room within the comfort zone?"

  - id: is_dangerous
    kind: formula
    expr: "=feels_like_c > 35 || sensor.temperature < 5"
    description: "Boolean: conditions are dangerous (heat or cold)"

  - id: pressure_trend
    kind: formula
    expr: "=sensor.pressure > 1020 ? 'rising' : (sensor.pressure < 1000 ? 'falling' : 'steady')"
    description: "Qualitative barometric trend"

  # -------------------------------------------------------------------------
  # Listeners — react to changes in watched cells. The condition
  # fires whenever a watched cell's value updates and the
  # expression evaluates to truthy.
  # -------------------------------------------------------------------------

  - id: alert.dangerous
    kind: listener
    watch: [is_dangerous]
    condition: "caller.metadata.current === true && caller.metadata.prev !== true"
    action: log.dangerous
    description: "Fires on the safe->dangerous edge"

  # PLAY-TEST FIX: was `kind: io` — io cells are push-only value holders,
  # so calling one as a listener action is a silent no-op. A program cell
  # is the action kind that actually produces an observable effect.
  - id: log.dangerous
    kind: program
    description: "Writes a warning when conditions are dangerous"
    code: |
      // NOTE (play-test finding): listener actions receive the event via
      // `input` ({changed, value}) — caller.metadata is NOT propagated to
      // the action, so read live cells via runtime.get instead.
      const feels = (await runtime.get('feels_like_c')).data;
      return {
        severity: 'warn',
        message: `Dangerous conditions: feels like ${feels}C`,
        timestamp: Date.now(),
      };

  - id: alert.comfort_lost
    kind: listener
    watch: [is_comfortable]
    # PLAY-TEST FIX: was "=is_comfortable == false" — the leading '=' made
    # evalWhen throw a SyntaxError on every fire, silently swallowed, so
    # this listener could never fire. Conditions are bare expressions.
    condition: "caller.metadata.current === false && caller.metadata.prev === true"
    action: log.comfort_lost
    description: "Fires on the comfortable->uncomfortable edge"

  # PLAY-TEST FIX: was `kind: io` — see log.dangerous note above.
  - id: log.comfort_lost
    kind: program
    description: "Writes a notice when comfort zone is lost"
    code: |
      const temp = (await runtime.get('sensor.temperature')).data;
      return {
        severity: 'info',
        message: `Comfort zone lost (temp is now ${temp}C)`,
        timestamp: Date.now(),
      };

  # -------------------------------------------------------------------------
  # Router — a caller-aware view. Different consumers ask for
  # different representations. The `caller.row` value is a column
  # header (e.g. "imperial", "metric", "summary") that selects
  # which cell to surface.
  # -------------------------------------------------------------------------

  - id: view.by_unit
    kind: router
    rules:
      - when: 'caller.row == "metric"'
        route: feels_like_c
      - when: 'caller.row == "imperial"'
        route: feels_like_f
      - when: 'caller.row == "summary"'
        route: is_dangerous
      - when: 'caller.row == "comfort"'
        route: is_comfortable
    description: "Returns a different value depending on the caller's unit preference"
