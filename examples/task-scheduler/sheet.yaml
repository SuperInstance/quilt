id: task-scheduler
title: "Reactive Task Scheduler with Listener Triggers"
description: >
  Models a small task scheduler. Tasks have a name, status,
  and a 'next_run_at' timestamp. A listener cell watches the
  clock and fires when any task is due. Demonstrates the
  listener cell kind, with chained formulas computing
  derived state (overdue, ready, completed).
version: 0.2.0

axes:
  rows: { name: task }
  cols: { name: field }

cells:
  # -------------------------------------------------------------------------
  # The clock — the only sensor in this example.
  # The harness updates it.
  # -------------------------------------------------------------------------

  - id: clock.now
    kind: value
    value: 0
    description: "Current time (ms since epoch) — set by the harness"

  # -------------------------------------------------------------------------
  # Three sample tasks. Each has:
  #   - a name (for display)
  #   - a status (pending | running | done | failed)
  #   - a next_run_at (when to run next)
  #   - a duration_ms (how long the last run took)
  # -------------------------------------------------------------------------

  - id: task.daily_summary.name
    kind: value
    value: "Daily summary"
    description: "Task 1 name"

  - id: task.daily_summary.status
    kind: value
    value: "pending"
    description: "Task 1 status"

  - id: task.daily_summary.next_run_at
    kind: value
    value: 0
    description: "When to run next (ms)"

  - id: task.daily_summary.duration_ms
    kind: value
    value: 0
    description: "Last run duration"

  - id: task.backup.name
    kind: value
    value: "Database backup"
    description: "Task 2 name"

  - id: task.backup.status
    kind: value
    value: "pending"
    description: "Task 2 status"

  - id: task.backup.next_run_at
    kind: value
    value: 0
    description: "When to run next (ms)"

  - id: task.backup.duration_ms
    kind: value
    value: 0
    description: "Last run duration"

  - id: task.healthcheck.name
    kind: value
    value: "Health check"
    description: "Task 3 name"

  - id: task.healthcheck.status
    kind: value
    value: "pending"
    description: "Task 3 status"

  - id: task.healthcheck.next_run_at
    kind: value
    value: 0
    description: "When to run next (ms)"

  - id: task.healthcheck.duration_ms
    kind: value
    value: 0
    description: "Last run duration"

  # -------------------------------------------------------------------------
  # Derived cells — formulas that compute ready/overdue/etc.
  # These recompute when their inputs change.
  # -------------------------------------------------------------------------

  - id: task.daily_summary.is_overdue
    kind: formula
    expr: '=task.daily_summary.next_run_at > 0 && task.daily_summary.next_run_at < clock.now && task.daily_summary.status != "running"'
    description: "Is this task overdue?"

  - id: task.backup.is_overdue
    kind: formula
    expr: '=task.backup.next_run_at > 0 && task.backup.next_run_at < clock.now && task.backup.status != "running"'
    description: "Is this task overdue?"

  - id: task.healthcheck.is_overdue
    kind: formula
    expr: '=task.healthcheck.next_run_at > 0 && task.healthcheck.next_run_at < clock.now && task.healthcheck.status != "running"'
    description: "Is this task overdue?"

  # PLAY-TEST FIX: was a `program` cell. Programs are only re-evaluated on
  # explicit call — propagation never recomputes them, so the listener below
  # could only ever see a stale value. Derived boolean state belongs in a
  # formula (pure, auto-tracked, recomputed eagerly on push).
  - id: scheduler.any_overdue
    kind: formula
    expr: '=task.daily_summary.is_overdue || task.backup.is_overdue || task.healthcheck.is_overdue'
    description: "True when any task is overdue"

  # Kept the program variant under a new id — useful for dashboards that
  # want the LIST of overdue tasks, called explicitly by the harness.
  - id: scheduler.overdue_list
    kind: program
    code: |
      const tasks = ['daily_summary', 'backup', 'healthcheck'];
      const overdue = [];
      for (const t of tasks) {
        const v = (await runtime.get('task.' + t + '.is_overdue')).data;
        if (v === true) overdue.push(t);
      }
      return overdue;
    description: "List of overdue tasks (program cell, walks the formulas)"

  - id: scheduler.summary
    kind: program
    code: |
      const tasks = ['daily_summary', 'backup', 'healthcheck'];
      const summary = {};
      for (const t of tasks) {
        const status = (await runtime.get('task.' + t + '.status')).data;
        const next_run = (await runtime.get('task.' + t + '.next_run_at')).data;
        const overdue = (await runtime.get('task.' + t + '.is_overdue')).data;
        summary[t] = {
          status: status,
          next_run_at: next_run,
          overdue: overdue,
        };
      }
      return summary;
    description: "Snapshot of all tasks — what the dashboard reads"

  # -------------------------------------------------------------------------
  # Listeners — react to overdue tasks.
  # -------------------------------------------------------------------------

  - id: alert.overdue
    kind: listener
    watch: [scheduler.any_overdue]
    condition: "caller.metadata.current === true && caller.metadata.prev !== true"
    action: log.overdue
    description: "Fires on the ok->overdue edge"

  # PLAY-TEST FIX: was `kind: io` — io cells are push-only, so calling one
  # as a listener action is a silent no-op. Program cells are the action kind.
  - id: log.overdue
    kind: program
    description: "Builds the overdue warning"
    code: |
      const list = (await runtime.get('scheduler.overdue_list')).data;
      return {
        severity: 'warn',
        message: `Overdue tasks: ${(list ?? []).join(', ') || 'unknown'}`,
        timestamp: Date.now(),
      };
